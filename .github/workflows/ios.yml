name: Build Joy Doodle iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package DoodleStudio IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudioTests \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

      - name: Build iOS Application (Release)
        run: |
          xcodebuild build \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -R build_device/Build/Products/Release-iphoneos/DoodleStudio.app Payload/
          codesign --force --deep --sign - Payload/DoodleStudio.app || true
          zip -r -9 JoyDoodle.ipa Payload

      - name: Upload JoyDoodle-IPA
        uses: actions/upload-artifact@v4
        with:
          name: JoyDoodle-IPA
          path: JoyDoodle.ipa
          retention-days: 14

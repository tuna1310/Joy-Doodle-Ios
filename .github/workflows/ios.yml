name: Build Joy Doodle iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Joy Doodle (Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # List available Xcode versions on macos-15 runner
          ls /Applications/ | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -clonedSourcePackagesDirPath .build/packages

      - name: Build for Simulator
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Run Unit Tests (Simulator)
        id: test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -only-testing:DoodleStudioTests \
            2>&1 | tee test_log.txt
        continue-on-error: true

      - name: Upload Build Log (on failure)
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7

      - name: Upload Test Log (on failure)
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test_log.txt
          retention-days: 7

      - name: Upload Simulator App (on success)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JoyDoodle-Simulator
          path: build_sim/Build/Products/Debug-iphonesimulator/DoodleStudio.app
          retention-days: 14

      - name: Check Build Status
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "❌ Build failed. Check build-log artifact above."
            exit 1
          fi
          echo "✅ Build succeeded."

  package-unsigned-ipa:
    name: Build & Package Joy Doodle IPA (Unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # List available Xcode versions on macos-15 runner
          ls /Applications/ | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -clonedSourcePackagesDirPath .build/packages

      - name: Archive iOS Application (Release, Unsigned)
        id: archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build_archive/DoodleStudio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | tee xcodebuild.log
        continue-on-error: true

      - name: Upload xcodebuild Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ipa-log
          path: xcodebuild.log
          retention-days: 30

      - name: Package Unsigned IPA
        if: steps.archive.outcome == 'success'
        run: |
          mkdir -p Payload
          APP_PATH="build_archive/DoodleStudio.xcarchive/Products/Applications/DoodleStudio.app"
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
          else
            echo "Error: $APP_PATH not found"
            exit 1
          fi
          zip -r -9 JoyDoodle-unsigned.ipa Payload

      - name: Upload Unsigned IPA
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JoyDoodle-unsigned-IPA
          path: JoyDoodle-unsigned.ipa
          retention-days: 30

      - name: Verify Archive Status
        run: |
          if [ "${{ steps.archive.outcome }}" = "failure" ]; then
            echo "❌ IPA Archive failed. Check xcodebuild-ipa-log artifact."
            exit 1
          fi
          echo "✅ Unsigned IPA created successfully."

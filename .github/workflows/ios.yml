name: Build Joy Doodle IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Joy Doodle IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS Application (Release)
        run: |
          xcodebuild build \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -R build_device/Build/Products/Release-iphoneos/DoodleStudio.app Payload/
          codesign --force --deep --sign - Payload/DoodleStudio.app || true
          zip -r -9 JoyDoodleApp.ipa Payload

      - name: Upload JoyDoodle-IPA
        uses: actions/upload-artifact@v4
        with:
          name: JoyDoodleApp-IPA
          path: JoyDoodleApp.ipa
          retention-days: 14

name: Build Joy Doodle iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Joy Doodle (Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Listing all installed Xcode apps:"
          ls -la /Applications/ | grep -i xcode || true
          # Prefer official default Xcode of the runner (/Applications/Xcode.app) which has full iOS runtimes
          if [ -d "/Applications/Xcode.app" ]; then
            echo "Selecting default Xcode (/Applications/Xcode.app)..."
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            echo "Selecting Xcode 16.4..."
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            echo "Selecting Xcode 16.3..."
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            echo "Selecting Xcode 16.1..."
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -clonedSourcePackagesDirPath .build/packages

      - name: Build for Simulator
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build_sim \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Run Unit Tests (Simulator)
        id: test
        run: |
          set -o pipefail
          # Find first available iPhone simulator device ID
          SIM_ID=$(xcrun simctl list devices available | grep -m 1 -E "iPhone (16|15|14)" | sed -E 's/.*\(([-A-F0-9]+)\).*/\1/' || true)
          if [ -n "$SIM_ID" ]; then
            DEST="platform=iOS Simulator,id=$SIM_ID"
          else
            DEST="platform=iOS Simulator,name=iPhone 16"
          fi
          echo "Running tests on destination: $DEST"
          xcodebuild test \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -sdk iphonesimulator \
            -destination "$DEST" \
            -configuration Debug \
            -derivedDataPath build_sim \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -only-testing:DoodleStudioTests \
            2>&1 | tee test_log.txt
        continue-on-error: true

      - name: Upload Build Log (on failure)
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7

      - name: Upload Test Log (on failure)
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test_log.txt
          retention-days: 7

      - name: Upload Simulator App (on success)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JoyDoodle-Simulator
          path: build_sim/Build/Products/Debug-iphonesimulator/DoodleStudio.app
          retention-days: 14

      - name: Check Build Status
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "❌ Build failed. Check build-log artifact above."
            exit 1
          fi
          echo "✅ Build succeeded."

  package-unsigned-ipa:
    name: Build & Package Joy Doodle IPA (Unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Listing all installed Xcode apps:"
          ls -la /Applications/ | grep -i xcode || true
          # Prefer official default Xcode of the runner (/Applications/Xcode.app) which has full iOS runtimes
          if [ -d "/Applications/Xcode.app" ]; then
            echo "Selecting default Xcode (/Applications/Xcode.app)..."
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            echo "Selecting Xcode 16.4..."
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            echo "Selecting Xcode 16.3..."
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            echo "Selecting Xcode 16.1..."
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -clonedSourcePackagesDirPath .build/packages

      - name: Archive iOS Application (Release, Unsigned)
        id: archive
        run: |
          set -o pipefail
          # 1. Attempt xcodebuild archive
          xcodebuild archive \
            -project DoodleStudio.xcodeproj \
            -scheme DoodleStudio \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build_archive/DoodleStudio.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | tee xcodebuild.log || true

          # 2. If archive output was not generated, fallback to direct device build
          if [ ! -d "build_archive/DoodleStudio.xcarchive/Products/Applications/DoodleStudio.app" ]; then
            echo "Notice: Archive packaging didn't produce DoodleStudio.app, performing direct iphoneos Release build..."
            xcodebuild build \
              -project DoodleStudio.xcodeproj \
              -scheme DoodleStudio \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -derivedDataPath build_device \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              DEVELOPMENT_TEAM="" \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              2>&1 | tee -a xcodebuild.log
          fi

      - name: Upload xcodebuild Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ipa-log
          path: xcodebuild.log
          retention-days: 30

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=""
          if [ -d "build_archive/DoodleStudio.xcarchive/Products/Applications/DoodleStudio.app" ]; then
            APP_PATH="build_archive/DoodleStudio.xcarchive/Products/Applications/DoodleStudio.app"
          elif [ -d "build_device/Build/Products/Release-iphoneos/DoodleStudio.app" ]; then
            APP_PATH="build_device/Build/Products/Release-iphoneos/DoodleStudio.app"
          fi

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Packaging app from $APP_PATH into Payload/ ..."
            cp -R "$APP_PATH" Payload/
            zip -r -9 JoyDoodle-unsigned.ipa Payload
          else
            echo "❌ Error: DoodleStudio.app was not produced by archive or build."
            exit 1
          fi

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JoyDoodle-unsigned-IPA
          path: JoyDoodle-unsigned.ipa
          retention-days: 30

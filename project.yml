name: DoodleStudio
options:
  bundleIdPrefix: com.doodlestudio
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "11.0.0"
targets:
  DoodleStudio:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DoodleStudio
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.doodlestudio.app
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - package: GoogleMobileAds
  DoodleStudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DoodleStudioTests
    dependencies:
      - target: DoodleStudio
